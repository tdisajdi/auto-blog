<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:G11;src:url(../fonts/galmuri-2.40.3/package/dist/Galmuri11-Bold.woff2)}
*{margin:0;box-sizing:border-box}body{background:#222}
.cv{position:relative;width:1200px;height:675px;overflow:hidden;font-family:G11;margin-bottom:20px}
canvas{position:absolute;inset:0;width:1200px;height:675px;image-rendering:pixelated}
.hud{position:absolute;top:20px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;font-size:25px;text-shadow:5px 5px 0 #18202c}
.hud .score{text-align:right}.hud .score small{display:block;font-size:20px;color:#f4c44e}.hud .score b{font-size:60px;color:#fff;letter-spacing:-1px}
.box{position:absolute;left:25px;right:25px;bottom:25px;background:#18202c;border:5px solid #fff;box-shadow:0 0 0 5px #18202c;padding:22px 30px 22px 30px;color:#fff}
.box .who{position:absolute;top:-30px;left:20px;background:#f4c44e;color:#18202c;font-size:20px;padding:6px 12px 3px;border:5px solid #18202c}
.box .t{font-size:40px;line-height:1.35;word-break:keep-all}
.box .next{position:absolute;right:22px;bottom:14px;color:#f4c44e;font-size:25px;animation:none}
.vs{position:absolute;top:120px;left:0;right:0;text-align:center;font-size:90px;color:#f4c44e;text-shadow:6px 6px 0 #b8322a,12px 12px 0 #18202c}
.hp{position:absolute;top:22px;width:470px;color:#fff;font-size:22px;text-shadow:4px 4px 0 #18202c}
.hp i{display:block;height:30px;margin-top:6px;border:5px solid #18202c;background:linear-gradient(90deg,#f4c44e 100%,#5c6575 0)}
.hp.l{left:25px}.hp.r{right:25px;text-align:right}
.tag{position:absolute;color:#18202c;background:#fff;border:5px solid #18202c;font-size:24px;padding:6px 12px 3px}
</style>
<body>
<div id="out"></div>
<script>
const P=5,W=240,H=135;
const C={o:'#18202c',w:'#ffffff',g:'#ffffff',s:'#d9e0ec',e:'#18202c',p:'#ff9db0',r:'#ec4a37',R:'#b8322a',h:'#ffb8a0',y:'#f4c44e',Y:'#c99512',
 b:'#3d6dff',B:'#2a3fa8',t:'#2bb3c0',T:'#17818b',n:'#ff8a3d',N:'#c2410c',k:'#5c6575',l:'#e3e6ee',G:'#4fb98a',D:'#2f8a63',S:'#8fd3ff',Q:'#5aa9ec',q:'#b8e4ff'};
function inner(s){return '....o'+s+'o....'}
const MASCOT=['.....oooooo.....',inner('ggggss'),inner('ggggss'),inner('gegges'),inner('gegges'),inner('pgggps'),inner('ggoogs'),inner('ggggss'),
 '..ooo'+'ggggss'+'ooo..','..o.o'+'rrrrRR'+'o.o..',inner('hrrrRR'),inner('hrrrRR'),inner('rrrrRR'),inner('rrrrRR'),inner('rrrrRR'),'...o'+'rrrrrrRR'+'o...',
 '..o'+'rrrrrrrrRR'+'o..','..o'+'rhhrrrrrRR'+'o..','..o'+'rhrrrrrrRR'+'o..','..o'+'rrrrrrrRRR'+'o..','...o'+'rrrrrRRR'+'o...','....oooooooo....','.....oo..oo.....','.....oo..oo.....'];
const MASCOT_B=MASCOT.map(r=>r.replace(/r/g,'b').replace(/R/g,'B').replace(/h/g,'q'));
const COIN=['.oooo.','oyyyYo','oyYyYo','oyYyYo','oyyyYo','.oooo.'];
const FLAG_K=['oooooooo','owwwwwwo','owwrrwwo','owrrbbwo','owwbbwwo','owwwwwwo','oooooooo','o.......','o.......','o.......','o.......','o.......'];
const FLAG_U=['oooooooo','orrrrrro','owwwwwwo','orrrrrro','owwwwwwo','orrrrrro','oooooooo','o.......','o.......','o.......','o.......','o.......'];
function sprite(x,rows,ox,oy,flip){rows.forEach((r,j)=>{[...r].forEach((ch,i)=>{if(C[ch]){x.fillStyle=C[ch];x.fillRect(ox+(flip?r.length-1-i:i),oy+j,1,1);}});});}
function sky(x,top,bot){for(let y=0;y<H;y++){const t=y/H;x.fillStyle=y<H*0.33?top[0]:y<H*0.55?top[1]:top[2];x.fillRect(0,y,W,1);}}
function dither(x,y0,c1,c2){for(let y=y0;y<y0+2;y++)for(let i=0;i<W;i++){if((i+y)%2==0){x.fillStyle=c2;x.fillRect(i,y,1,1);}}}
function cloud(x,cx,cy){x.fillStyle='#fff';[[2,0,8,1],[0,1,12,3],[1,4,10,1]].forEach(([a,b,c,d])=>x.fillRect(cx+a,cy+b,c,d));x.fillStyle='#d9e0ec';x.fillRect(cx+1,cy+4,10,1);}
function hills(x,base,col,amp,per,ph){x.fillStyle=col;for(let i=0;i<W;i++){const h=Math.round(amp*(1+Math.sin((i+ph)/per))/2);x.fillRect(i,base-h,1,H-base+h);}}
function ground(x,gy){x.fillStyle='#4fb98a';x.fillRect(0,gy,W,3);x.fillStyle='#2f8a63';x.fillRect(0,gy+3,W,1);
 for(let y=gy+4;y<H;y++){x.fillStyle=((y-gy)%6<1)?'#8a4b2a':'#c2703d';x.fillRect(0,y,W,1);}
 x.fillStyle='#8a4b2a';for(let y=gy+4;y<H;y+=6)for(let i=((y-gy)/6%2)*6;i<W;i+=12)x.fillRect(i,y,1,6);}
function base(x,pal){x.fillStyle=pal[0];x.fillRect(0,0,W,45);x.fillStyle=pal[1];x.fillRect(0,45,W,30);x.fillStyle=pal[2];x.fillRect(0,75,W,60);
 dither(x,44,pal[0],pal[1]);dither(x,74,pal[1],pal[2]);}
function make(id,draw,html){const d=document.createElement('div');d.className='cv';d.id=id;const c=document.createElement('canvas');c.width=W;c.height=H;d.appendChild(c);
 const x=c.getContext('2d');draw(x);d.insertAdjacentHTML('beforeend',html);document.getElementById('out').appendChild(d);}
const SKY=['#5aa9ec','#8fd3ff','#b8e4ff'];
// 1) 세금 VS (격투 게임 화면)
make('c701',x=>{base(x,['#2a3fa8','#3d6dff','#8fd3ff']);cloud(x,30,40);cloud(x,180,30);hills(x,95,'#17818b',14,9,0);ground(x,98);
 sprite(x,FLAG_U,40,70);sprite(x,MASCOT,52,74);sprite(x,FLAG_K,188,70,true);sprite(x,MASCOT_B,172,74,true);
 for(let i=0;i<5;i++)sprite(x,COIN,104+i*7,90-(i%2)*3);},
 `<div class="hp l">해외 상장 ETF<i></i></div><div class="hp r">국내 상장 ETF<i></i></div><div class="vs">VS</div>
 <div class="tag" style="left:470px;top:300px">한 해 이익 833만 원</div>
 <div class="box"><span class="who">ETF · GUIDE</span><div class="t">해외 상장 ETF vs 국내 상장 ETF,<br>한 해 이익 833만 원이 가르는 세금 차이</div><span class="next">▼</span></div>`);
// 2) 보수 (동전 모으는 횡스크롤)
make('c705',x=>{base(x,SKY);cloud(x,20,15);cloud(x,150,25);hills(x,92,'#4fb98a',18,12,30);hills(x,96,'#2f8a63',10,7,0);ground(x,98);
 sprite(x,MASCOT,40,74);for(let i=0;i<9;i++)sprite(x,COIN,70+i*15,62+Math.round(6*Math.sin(i/1.3)));
 const cx=196,cy=82;x.fillStyle='#18202c';x.fillRect(cx,cy,22,16);x.fillStyle='#c2703d';x.fillRect(cx+1,cy+1,20,14);x.fillStyle='#8a4b2a';x.fillRect(cx+1,cy+6,20,2);x.fillStyle='#f4c44e';x.fillRect(cx+9,cy+5,4,5);x.fillStyle='#18202c';x.fillRect(cx+10,cy+7,2,2);},
 `<div class="hud"><span>ETF · GUIDE<br><span style="color:#f4c44e">STAGE 02</span></span><span class="score"><small>총보수 차이</small><b>0.1%</b></span></div>
 <div class="box"><span class="who">10년 뒤 내 계좌엔?</span><div class="t">ETF 총보수 0.1% 차이,<br>10년 뒤 내 계좌엔 얼마 차이날까?</div><span class="next">▼</span></div>`);
// 3) 낙폭 (구덩이로 떨어졌다 올라오는 길)
make('cmdd',x=>{base(x,['#18202c','#2a3fa8','#5aa9ec']);for(let i=0;i<30;i++){x.fillStyle='#fff';x.fillRect((i*53)%W,(i*29)%40,1,1);}
 hills(x,80,'#17818b',12,10,10);
 const path=[];for(let i=0;i<W;i++){let y=52;if(i>60&&i<115)y=52+(i-60)*0.6;if(i>=115&&i<130)y=85;if(i>=130&&i<200)y=85-(i-130)*0.44;if(i>=200)y=54;path.push(Math.round(y));}
 for(let i=0;i<W;i++){x.fillStyle='#4fb98a';x.fillRect(i,path[i],1,2);x.fillStyle='#c2703d';x.fillRect(i,path[i]+2,1,H);x.fillStyle='#8a4b2a';if((i+path[i])%7==0)x.fillRect(i,path[i]+4,1,2);}
 sprite(x,MASCOT,114,61);x.fillStyle='#ec4a37';for(let i=0;i<3;i++)x.fillRect(96+i*4,58+i*6,2,2);},
 `<div class="hud"><span>ETF · GUIDE<br><span style="color:#f4c44e">STAGE 03</span></span><span class="score"><small>MAX DRAWDOWN</small><b>MDD</b></span></div>
 <div class="box"><span class="who">얼마나 떨어져도 버틸까</span><div class="t">최대 낙폭(MDD)으로<br>내가 버틸 수 있는 ETF 고르기</div><span class="next">▼</span></div>`);
// 4) 기업 (마을 건물)
make('caapl',x=>{base(x,SKY);cloud(x,40,12);cloud(x,190,20);hills(x,90,'#4fb98a',12,14,0);ground(x,98);
 const bx=130;x.fillStyle='#18202c';x.fillRect(bx-1,34,62,64);x.fillStyle='#e3e6ee';x.fillRect(bx,35,60,63);x.fillStyle='#d9e0ec';x.fillRect(bx+48,35,12,63);
 for(let r=0;r<6;r++)for(let c=0;c<4;c++){x.fillStyle=(r+c)%3==0?'#f4c44e':'#3d6dff';x.fillRect(bx+5+c*13,40+r*9,8,5);}
 x.fillStyle='#18202c';x.fillRect(bx+24,86,12,12);x.fillStyle='#c2703d';x.fillRect(bx+25,87,10,11);
 x.fillStyle='#18202c';x.fillRect(bx+10,26,40,10);x.fillStyle='#fff';x.fillRect(bx+11,27,38,8);
 sprite(x,MASCOT,70,74);},
 `<div class="tag" style="left:752px;top:136px;font-size:30px;border:0;background:none;padding:0;color:#18202c">AAPL</div>
 <div class="hud"><span>ETF · COMPANY<br><span style="color:#f4c44e">NEW AREA</span></span><span></span></div>
 <div class="box"><span class="who">애플</span><div class="t">애플은 어떤 회사인가:<br>매출·낙폭·배당, 그리고 ETF로 사면 담기는 비중</div><span class="next">▼</span></div>`);
</script>
</body>
