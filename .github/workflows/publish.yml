name: ETF 블로그 자동 발행 (발굴→토론→승인 흐름)

on:
  # [1] 매일 아침: 1번(발굴)->2번(토론) 진행 후 텔레그램으로 알림만 보냄.
  # 아래 cron은 UTC 기준 22:30 = 한국시간(KST) 07:30. 원하는 시간으로 조정 가능.
  schedule:
    - cron: '30 22 * * *'   # 매일 아침 발굴+토론+알림
    - cron: '7 3 * * *'     # 매일 낮(KST 12:07) - ETF 외 분야 두 번째 글 발굴+알림 (topic_engine.py)
    - cron: '*/10 * * * *'  # 10분마다 승인 여부 확인
    - cron: '0 20 * * 1'    # 매주 월요일 - Search Console 성과 동기화
    - cron: '0 21 * * 0'    # 매주 일요일 - 주간 상태 점검 리포트

  # 외부 알람(cron-job.org)은 아래 수동 실행(workflow_dispatch)을 tick=true로 부른다.
  # 그 토큰에는 "Actions 실행" 권한만 주면 되고 코드 수정 권한(Contents)이 필요 없어서 더 안전하다.
  # (repository_dispatch 방식도 남겨두지만 그쪽은 Contents 쓰기 권한이 필요해 권장하지 않음)
  # 외부 알람(cron-job.org 등)이 깃허브 API로 'tick'을 보내면 10분 점검 잡과 똑같이 실행.
  # 깃허브 예약 실행이 자주 밀리거나 빠지기 때문에 시간을 지키기 위한 보조 수단.
  repository_dispatch:
    types: [tick]

  # 수동 실행(테스트/디버깅용) - 예전처럼 topic/detect_only로 즉시 발행도 가능
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 티커로 강제 지정 (비워두면 자동 선정 로직 사용)'
        required: false
        default: ''
      replace_url:
        description: '다시 쓰기: 이 글 주소를 새로 쓴 글로 바꿈 (topic과 같이 사용, 예: GUIDE:... + 글 주소)'
        required: false
        default: ''
      detect_only:
        description: '실제 발행 없이 다음 후보 티커만 확인'
        required: false
        type: boolean
        default: false
      check_universe:
        description: '발굴 대상 ETF 목록이 데이터를 받아오는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false
      tick:
        description: '10분 점검 1회 (외부 알람 cron-job.org가 쓰는 옵션 - 직접 켤 일은 거의 없음)'
        required: false
        type: boolean
        default: false
      etf_discover:
        description: 'ETF 추천을 지금 한 번 만들어 텔레그램으로 받기 (아침 추천이 안 왔을 때)'
        required: false
        type: boolean
        default: false
      topic_discover:
        description: '두 번째 글(ETF 외 분야) 추천을 지금 한 번 만들어 텔레그램으로 받기'
        required: false
        type: boolean
        default: false
      check_sources:
        description: 'EIA·KOSIS(공식 통계) 키가 작동하는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false
      check_trends:
        description: '구글 트렌드 조회가 되는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# [수정] discover-and-notify(매일 22:30 UTC)와 check-approval-and-publish(10분마다)는
# 22:30이 10분 간격 위에 정확히 걸려서 매일 동시에 트리거된다. 주간 잡(월 20:00, 일 21:00 UTC)도
# 마찬가지로 10분 그리드와 겹친다. 두 번째 슬롯(topic_engine.py)도 같은
# 브랜치에 상태 파일을 커밋+푸시하므로, 그룹 이름을 레포 전체 공용으로
# 맞춰서(blog-publish-state) 잡 사이의 푸시 경합까지 함께 막는다.
# cancel-in-progress:false로 서로 취소시키지 않고 순서대로(큐잉) 실행되게 한다.
concurrency:
  group: blog-publish-state
  cancel-in-progress: false

env:
  # 모든 잡에서 공통으로 쓰는 시크릿/설정. (잡마다 반복 정의하는 대신 여기 한 번만)
  NONINTERACTIVE: "1"
  PLATFORM: wordpress
  CHART_MODE: script
  MIN_PUBLISH_INTERVAL_HOURS: "20"
  # blog_engine.py가 이 값으로 상태 파일 이름을 접두어(etf_)로 구분한다.
  # 두 번째 슬롯 카테고리(잡에서 BLOG_CATEGORY를 덮어씀)와 상태 파일이 섞이지 않게 하는 용도.
  BLOG_CATEGORY: etf

jobs:
  # ============================================================
  # 잡 1: 매일 아침 - 1번(발굴) -> 2번(토론) -> 텔레그램 알림
  # cron '30 22 * * *' 에 의해서만 실행되도록 조건을 건다.
  # ============================================================
  discover-and-notify:
    if: github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 발굴 + 토론 + 텔레그램 알림 (오늘 이미 보냈으면 건너뜀)
        run: python etf_auto.py --discover-and-notify --if-due
      - name: 대기 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_recommendation.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 오늘의 추천 후보 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "아침 ETF 추천" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true


  # ============================================================
  # 잡 2: 10분마다 - 승인/override 응답 확인. 확정되면 바로 이어서
  # 3~5번(기획->글쓰기->검수->발행)까지 같은 잡 안에서 진행.
  # cron '*/10 * * * *' 에 의해서만 실행되도록 조건을 건다.
  # ============================================================
  discover-topic:
    if: github.event.schedule == '7 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: ETF 외 분야 발굴 + 텔레그램 알림 (오늘 이미 보냈으면 건너뜀)
        run: python topic_engine.py --discover --if-due
      - name: 대기 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_topic.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 두 번째 글 추천 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "낮 두 번째 글 추천" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true


  check-approval-and-publish:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tick == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - run: sudo apt-get update && sudo apt-get install -y xclip
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env

      # 아침/낮 예약 실행이 빠졌으면 여기서 대신 보낸다 (이미 보냈으면 바로 넘어감)
      - name: 놓친 추천 보충
        run: |
          python etf_auto.py --discover-and-notify --if-due || echo "⚠️ ETF 추천 보충 실패 - 승인 확인은 계속 진행"
          python topic_engine.py --discover --if-due || echo "⚠️ 두 번째 글 추천 보충 실패 - 승인 확인은 계속 진행"

      - name: 텔레그램 응답 확인
        id: check
        run: |
          OUTPUT=$(python etf_auto.py --check-approval)
          echo "$OUTPUT"
          TICKER=$(echo "$OUTPUT" | grep -oP 'APPROVED_TICKER:\K.*' || true)
          echo "ticker=$TICKER" >> "$GITHUB_OUTPUT"
          TOPIC2=$(echo "$OUTPUT" | grep -oP 'APPROVED_TOPIC:\K[a-z]+' || true)
          echo "topic2=$TOPIC2" >> "$GITHUB_OUTPUT"

      - name: 승인 상태 파일 커밋 (pending 해제/offset 갱신)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_recommendation.json 2>/dev/null || true
          git add pending_topic.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 텔레그램 응답 반영 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 승인된 티커로 발행 파이프라인 실행
        if: steps.check.outputs.ticker != ''
        run: python etf_auto.py --topic "${{ steps.check.outputs.ticker }}"

      - name: 발행 상태 파일 커밋
        if: steps.check.outputs.ticker != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_article_state.json 2>/dev/null || true
          git add etf_generation_state.json 2>/dev/null || true
          git add etf_api_usage_log.json 2>/dev/null || true
          git add indexnow_key.json 2>/dev/null || true
          git add etf/published_articles 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 자동 발행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 승인된 두 번째 글(ETF 외 분야) 발행
        if: steps.check.outputs.topic2 != ''
        env:
          BLOG_CATEGORY: ${{ steps.check.outputs.topic2 }}
        run: python topic_engine.py --run

      - name: 두 번째 글 상태 파일 커밋
        if: steps.check.outputs.topic2 != ''
        run: |
          T="${{ steps.check.outputs.topic2 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${T}_article_state.json" "${T}_generation_state.json" "${T}_api_usage_log.json" 2>/dev/null || true
          git add "${T}/published_articles" 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git pull --rebase --autostash || true
            git commit -m "chore: 두 번째 글 발행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "10분 점검(승인·글쓰기·그림)" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true


  # ============================================================
  # 잡 3: 매주 - Search Console 성과 데이터 동기화 (성과 분석 부서용).
  # GSC 연동 설정을 아직 안 했으면 코드가 알아서 건너뛰고 조용히 끝난다.
  # ============================================================
  sync-performance:
    if: github.event.schedule == '0 20 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 성과 데이터 동기화
        run: python etf_auto.py --sync-performance
      - name: 성과 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search_performance.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 검색 성과 데이터 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "주간 검색 성과 동기화" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true


  # ============================================================
  # 잡 4: 매주 - 상태 점검 리포트 (완전 무료, API 호출 없음).
  # ============================================================
  health-report:
    if: github.event.schedule == '0 21 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 주간 상태 점검 리포트 전송
        run: python etf_auto.py --health-report

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "주간 상태 점검" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true


  # ============================================================
  # 잡 5: 수동 실행 전용 (workflow_dispatch로 사람이 직접 눌렀을 때만).
  # 예전처럼 즉시 topic/detect_only로 테스트하고 싶을 때 사용.
  # ============================================================
  manual-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tick != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - run: sudo apt-get update && sudo apt-get install -y xclip
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env

      - name: 수동 실행
        env:
          REPLACE_URL: ${{ github.event.inputs.replace_url }}
        run: |
          if [ "${{ github.event.inputs.topic_discover }}" = "true" ]; then
            python topic_engine.py --discover
            exit 0
          fi
          if [ "${{ github.event.inputs.check_sources }}" = "true" ]; then
            python topic_engine.py --check-sources
            exit 0
          fi
          if [ "${{ github.event.inputs.etf_discover }}" = "true" ]; then
            python etf_auto.py --discover-and-notify
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event.inputs.check_trends }}" = "true" ]; then
            ARGS="--check-trends"
          elif [ "${{ github.event.inputs.check_universe }}" = "true" ]; then
            ARGS="--check-universe"
          elif [ "${{ github.event.inputs.detect_only }}" = "true" ]; then
            ARGS="--detect-only"
          elif [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic ${{ github.event.inputs.topic }}"
          fi
          python etf_auto.py $ARGS

      - name: 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_article_state.json 2>/dev/null || true
          git add etf_generation_state.json 2>/dev/null || true
          git add etf_api_usage_log.json 2>/dev/null || true
          git add indexnow_key.json 2>/dev/null || true
          git add etf/published_articles 2>/dev/null || true
          git add pending_recommendation.json 2>/dev/null || true
          git add pending_topic.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 수동 실행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "수동 실행" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && git pull --rebase --autostash -q && git push) || true

