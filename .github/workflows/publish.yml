name: ETF 블로그 자동 발행 (발굴→토론→승인 흐름)

on:
  # [1] 매일 아침: 1번(발굴)->2번(토론) 진행 후 텔레그램으로 알림만 보냄.
  # 아래 cron은 UTC 기준 22:30 = 한국시간(KST) 07:30. 원하는 시간으로 조정 가능.
  schedule:
    - cron: '30 22 * * *'   # 매일 아침 발굴+토론+알림
    - cron: '7 3 * * *'     # 매일 낮(KST 12:07) - ETF 외 분야 두 번째 글 발굴+알림 (topic_engine.py)
    - cron: '*/10 * * * *'  # 10분마다 승인 여부 확인
    - cron: '0 20 * * 1'    # 매주 월요일 - Search Console 성과 동기화
    - cron: '0 21 * * 0'    # 매주 일요일 - 주간 상태 점검 리포트

  # 외부 알람(cron-job.org)은 아래 수동 실행(workflow_dispatch)을 tick=true로 부른다.
  # 그 토큰에는 "Actions 실행" 권한만 주면 되고 코드 수정 권한(Contents)이 필요 없어서 더 안전하다.
  # (repository_dispatch 방식도 남겨두지만 그쪽은 Contents 쓰기 권한이 필요해 권장하지 않음)
  # 외부 알람(cron-job.org 등)이 깃허브 API로 'tick'을 보내면 10분 점검 잡과 똑같이 실행.
  # 깃허브 예약 실행이 자주 밀리거나 빠지기 때문에 시간을 지키기 위한 보조 수단.
  repository_dispatch:
    types: [tick]

  # 수동 실행(테스트/디버깅용) - 예전처럼 topic/detect_only로 즉시 발행도 가능
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 티커로 강제 지정 (비워두면 자동 선정 로직 사용)'
        required: false
        default: ''
      replace_url:
        description: '다시 쓰기: 이 글 주소를 새로 쓴 글로 바꿈 (topic과 같이 사용, 예: GUIDE:... + 글 주소)'
        required: false
        default: ''
      publish:
        description: '공개 실행(11-19 사용자 허락): topic과 같이 쓰면 품질 기준을 통과한 글은 바로 공개, 미달은 임시글. 끄면 시험(임시글)'
        required: false
        type: boolean
        default: false
      health_report:
        description: '주간 상태 점검 리포트를 지금 보내기(키·워드프레스·자료원·사이트 화면 캡처)'
        required: false
        type: boolean
        default: false
      topic2_test:
        description: '두 번째 글 시험 1편(승인 없이, 임시글): trend / tech / bio / energy / society 중 하나, 에너지 종목 지정은 energy:NG=F'
        required: false
        default: ''
      unpublish_url:
        description: '이 글을 비공개(임시글)로 내림 (글 주소 또는 ondo99.com/?p=번호)'
        required: false
        default: ''
      list_public:
        description: '지금 사이트에 공개된 글 목록 보기(번호·날짜·제목 - 공개 글 점검용, 바꾸는 것 없음)'
        required: false
        type: boolean
        default: false
      detect_only:
        description: '실제 발행 없이 다음 후보 티커만 확인'
        required: false
        type: boolean
        default: false
      check_universe:
        description: '발굴 대상 ETF 목록이 데이터를 받아오는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false
      tick:
        description: '10분 점검 1회 (외부 알람 cron-job.org가 쓰는 옵션 - 직접 켤 일은 거의 없음)'
        required: false
        type: boolean
        default: false
      etf_discover:
        description: 'ETF 추천을 지금 한 번 만들어 텔레그램으로 받기 (아침 추천이 안 왔을 때)'
        required: false
        type: boolean
        default: false
      topic_discover:
        description: '두 번째 글(ETF 외 분야) 추천을 지금 한 번 만들어 텔레그램으로 받기'
        required: false
        type: boolean
        default: false
      check_sources:
        description: 'EIA·KOSIS(공식 통계) 키가 작동하는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false
      lab_compete:
        description: '경쟁 글 비교 - 같은 질문 검색 상위 글의 구조를 모아 우리 글과 비교 (발행 안 함, AI 호출 없음)'
        required: false
        type: boolean
        default: false
      site_pages:
        description: '사이트 페이지 - draft(기본 페이지 비공개 초안)·publish(공개: 사용자 확인 후만)·board-draft(온도판)·token-check(권한 확인)·plugin-audit(플러그인 점검, 읽기만)·pll-push(전용 언어 플러그인 올리기)·site-tune / site-tune-undo(Jetpack 정리·태그라인)·refresh:SLUG(공개 기본 페이지 본문만 갱신)·tr:export|check|push:글번호(영어판 번역)·patch:SLUG(공개 글 문장 고치기)·pll:check / pll:set:ID:en / pll:link:ko=ID:en=ID·export(사이트 내용 백업)·drafts-fix(초안 종합 온도 띠 정리+링크 확인)·drafts-trash(연습 초안 모두 휴지통)·link-check(비공개 글 링크 확인)·shot(화면 캡처)'
        required: false
        default: ''
      lab_adsense:
        description: '애드센스 승인 확인 - lab/adsense_targets.json의 블로그가 승인받았는지(광고 실제 표시)와 구조를 잼 (발행 안 함, AI 호출 없음)'
        required: false
        type: boolean
        default: false
      lab_noise:
        description: '채점 흔들림 재기 - 최근 초안 4편을 3번씩 채점해 점수·지적이 얼마나 흔들리는지 (발행 안 함, AI 호출 약 50번)'
        required: false
        type: boolean
        default: false
      lab_exam:
        description: '검토 담당 시험지 풀기 - 정답을 아는 초안으로 검토가 결함을 잡는지 잼 (발행 안 함, AI 호출 약 60번)'
        required: false
        type: boolean
        default: false
      check_trends:
        description: '구글 트렌드 조회가 되는지 점검 (발행 안 함)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read     # watchdog.py가 실행 기록을 읽는 데 필요(읽기만)

# [수정] discover-and-notify(매일 22:30 UTC)와 check-approval-and-publish(10분마다)는
# 22:30이 10분 간격 위에 정확히 걸려서 매일 동시에 트리거된다. 주간 잡(월 20:00, 일 21:00 UTC)도
# 마찬가지로 10분 그리드와 겹친다. 두 번째 슬롯(topic_engine.py)도 같은
# 브랜치에 상태 파일을 커밋+푸시하므로, 그룹 이름을 레포 전체 공용으로
# 맞춰서(blog-publish-state) 잡 사이의 푸시 경합까지 함께 막는다.
# cancel-in-progress:false로 서로 취소시키지 않고 순서대로(큐잉) 실행되게 한다.
concurrency:
  group: blog-publish-state
  cancel-in-progress: false

env:
  # 모든 잡에서 공통으로 쓰는 시크릿/설정. (잡마다 반복 정의하는 대신 여기 한 번만)
  NONINTERACTIVE: "1"
  PLATFORM: wordpress
  CHART_MODE: script
  MIN_PUBLISH_INTERVAL_HOURS: "4"    # 11-19: 20→4 (첫 주 하루 3~4편 계획 - lab/THINKING 운영 사슬, 몰아 올리기는 막음)
  # blog_engine.py가 이 값으로 상태 파일 이름을 접두어(etf_)로 구분한다.
  # 두 번째 슬롯 카테고리(잡에서 BLOG_CATEGORY를 덮어씀)와 상태 파일이 섞이지 않게 하는 용도.
  BLOG_CATEGORY: etf

jobs:
  # ============================================================
  # 잡 1: 매일 아침 - 1번(발굴) -> 2번(토론) -> 텔레그램 알림
  # cron '30 22 * * *' 에 의해서만 실행되도록 조건을 건다.
  # ============================================================
  discover-and-notify:
    if: github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 발굴 + 토론 + 텔레그램 알림 (오늘 이미 보냈으면 건너뜀)
        run: python etf_auto.py --discover-and-notify --if-due
      - name: 온도판 숫자 매일 갱신 (AI 없음, 공개 여부 그대로 - 11-12)
        run: python ondo/board.py refresh || echo "⚠️ 온도판 갱신 실패 - 내일 다시"
      - name: 대기 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_recommendation.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          git add site_backup 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 오늘의 추천 후보 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "아침 ETF 추천" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true


  # ============================================================
  # 잡 2: 10분마다 - 승인/override 응답 확인. 확정되면 바로 이어서
  # 3~5번(기획->글쓰기->검수->발행)까지 같은 잡 안에서 진행.
  # cron '*/10 * * * *' 에 의해서만 실행되도록 조건을 건다.
  # ============================================================
  discover-topic:
    if: github.event.schedule == '7 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: ETF 외 분야 발굴 + 텔레그램 알림 (오늘 이미 보냈으면 건너뜀)
        run: python topic_engine.py --discover --if-due
      - name: 대기 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_topic.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          git add site_backup 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 두 번째 글 추천 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "낮 두 번째 글 추천" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true


  check-approval-and-publish:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tick == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env

      # 깃허브 자체 예약으로 돌 때만: 외부 알람(cron-job.org)이 1시간 넘게 안 불렀으면 텔레그램 알림 (watchdog.py)
      - name: 외부 알람 멈춤 감시
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python watchdog.py || echo "⚠️ 감시 실패 - 점검은 계속 진행"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 감시 알림 기록" -q && bash git_push_retry.sh) || true

      # 아침/낮 예약 실행이 빠졌으면 여기서 대신 보낸다 (이미 보냈으면 바로 넘어감)
      - name: 놓친 추천 보충
        run: |
          python etf_auto.py --discover-and-notify --if-due || echo "⚠️ ETF 추천 보충 실패 - 승인 확인은 계속 진행"
          python topic_engine.py --discover --if-due || echo "⚠️ 두 번째 글 추천 보충 실패 - 승인 확인은 계속 진행"

      - name: 텔레그램 응답 확인
        id: check
        run: |
          OUTPUT=$(python etf_auto.py --check-approval)
          echo "$OUTPUT"
          TICKER=$(echo "$OUTPUT" | grep -oP 'APPROVED_TICKER:\K.*' || true)
          echo "ticker=$TICKER" >> "$GITHUB_OUTPUT"
          TOPIC2=$(echo "$OUTPUT" | grep -oP 'APPROVED_TOPIC:\K[a-z]+' || true)
          echo "topic2=$TOPIC2" >> "$GITHUB_OUTPUT"

      - name: 승인 상태 파일 커밋 (pending 해제/offset 갱신)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_recommendation.json 2>/dev/null || true
          git add pending_topic.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          git add site_backup 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 텔레그램 응답 반영 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 승인된 티커로 발행 파이프라인 실행
        if: steps.check.outputs.ticker != ''
        env:
          # 11-19 사용자 결정 '본격 공개': 텔레그램으로 승인한 글 중 품질 기준을 통과한 글만 공개(미달은 임시글). 시험(manual-run)은 계속 임시글.
          AUTO_PUBLISH: "1"
        run: python etf_auto.py --topic "${{ steps.check.outputs.ticker }}"

      - name: 발행 상태 파일 커밋
        if: steps.check.outputs.ticker != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_article_state.json 2>/dev/null || true
          git add etf_generation_state.json 2>/dev/null || true
          git add etf_api_usage_log.json 2>/dev/null || true
          git add indexnow_key.json 2>/dev/null || true
          git add etf/published_articles 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 자동 발행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 승인된 두 번째 글(ETF 외 분야) 발행
        if: steps.check.outputs.topic2 != ''
        env:
          BLOG_CATEGORY: ${{ steps.check.outputs.topic2 }}
          AUTO_PUBLISH: "1"     # 11-19 '본격 공개' - 기준 통과 글만 공개
        run: python topic_engine.py --run

      - name: 두 번째 글 상태 파일 커밋
        if: steps.check.outputs.topic2 != ''
        run: |
          T="${{ steps.check.outputs.topic2 }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${T}_article_state.json" "${T}_generation_state.json" "${T}_api_usage_log.json" 2>/dev/null || true
          git add "${T}/published_articles" 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git pull --rebase --autostash || true
            git commit -m "chore: 두 번째 글 발행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "10분 점검(승인·글쓰기·그림)" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true


  # ============================================================
  # 잡 3: 매주 - Search Console 성과 데이터 동기화 (성과 분석 부서용).
  # GSC 연동 설정을 아직 안 했으면 코드가 알아서 건너뛰고 조용히 끝난다.
  # ============================================================
  sync-performance:
    if: github.event.schedule == '0 20 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 성과 데이터 동기화
        run: python etf_auto.py --sync-performance
      - name: 성과 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search_performance.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 검색 성과 데이터 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "주간 검색 성과 동기화" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true


  # ============================================================
  # 잡 4: 매주 - 상태 점검 리포트 (완전 무료, API 호출 없음).
  # ============================================================
  health-report:
    if: github.event.schedule == '0 21 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env
      - name: 화면 캡처 도구 설치 (주간 점검용)
        run: pip install playwright && python -m playwright install --with-deps chromium || echo "⚠️ 캡처 도구 설치 실패 - 캡처만 건너뜀"
      - name: 주간 상태 점검 리포트 전송
        run: python etf_auto.py --health-report
      - name: 사이트 내용 주간 백업 (글·페이지·머리/바닥글 → site_backup/)
        run: |
          python site_pages/export.py || echo "⚠️ 사이트 백업 실패 - 다음 주 다시"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_backup 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 사이트 내용 주간 백업 ($(date -u +'%Y-%m-%d'))" && bash git_push_retry.sh) || true

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "주간 상태 점검" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true


  # ============================================================
  # 잡 5: 수동 실행 전용 (workflow_dispatch로 사람이 직접 눌렀을 때만).
  # 예전처럼 즉시 topic/detect_only로 테스트하고 싶을 때 사용.
  # ============================================================
  manual-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tick != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
      - run: pip install -r requirements.txt
      - name: 통합 키 파일(.env) 복원
        env:
          DOTENV_CONTENTS: ${{ secrets.DOTENV_CONTENTS }}
        run: printf '%s\n' "$DOTENV_CONTENTS" > .env

      - name: 수동 실행
        env:
          # 11-19 사용자 허락: Claude가 고른 상록 글(가이드·비교 등)은 기준을 통과하면 승인 없이 공개. publish를 켠 실행만.
          AUTO_PUBLISH: ${{ github.event.inputs.publish == 'true' && '1' || '' }}
          REPLACE_URL: ${{ github.event.inputs.replace_url }}
          UNPUBLISH_URL: ${{ github.event.inputs.unpublish_url }}
          TOPIC2_TEST: ${{ github.event.inputs.topic2_test }}
        run: |
          if [ "${{ github.event.inputs.health_report }}" = "true" ]; then
            pip install -q playwright && python -m playwright install --with-deps chromium || echo "⚠️ 캡처 도구 설치 실패"
            python etf_auto.py --health-report
            exit $?
          fi
          if [ -n "$TOPIC2_TEST" ]; then
            case "$TOPIC2_TEST" in trend|tech|bio|energy|society|energy:*) ;; *) echo "❌ 분야 이름 확인: $TOPIC2_TEST"; exit 1;; esac
            BLOG_CATEGORY="${TOPIC2_TEST%%:*}" python topic_engine.py --test "$TOPIC2_TEST"
            exit $?
          fi
          if [ "${{ github.event.inputs.list_public }}" = "true" ]; then
            python -c "import blog_engine as b; ps = b.wp_list_public_posts(); print('공개 글:', '확인 실패' if ps is None else len(ps)); [print(p['id'], p['date'], p['title'][:60], p['url']) for p in ps or []]"
            exit 0
          fi
          if [ -n "$UNPUBLISH_URL" ]; then
            python -c "import sys, blog_engine as b; t = b.wp_find_post_by_url(sys.argv[1]); print('대상:', t); ok = bool(t) and b.wp_update_post(t[0], status='draft'); print('비공개 처리:', ok); sys.exit(0 if ok else 1)" "$UNPUBLISH_URL"
            exit $?
          fi
          if [ "${{ github.event.inputs.topic_discover }}" = "true" ]; then
            python topic_engine.py --discover
            exit 0
          fi
          if [ "${{ github.event.inputs.check_sources }}" = "true" ]; then
            python topic_engine.py --check-sources
            exit 0
          fi
          if [ "${{ github.event.inputs.lab_compete }}" = "true" ]; then
            python lab_bench.py compete --fetch || echo "경쟁 글 비교 실패"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.site_pages }}" ]; then
            if [ "${{ github.event.inputs.site_pages }}" = "token-check" ]; then
              python site_pages/token_check.py || echo "토큰 권한 확인 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "plugin-audit" ]; then
              python site_pages/plugin_audit.py || echo "플러그인 점검 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "site-tune" ]; then
              python site_pages/site_tune.py apply || echo "사이트 설정 정리 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "site-tune-undo" ]; then
              python site_pages/site_tune.py undo || echo "사이트 설정 되돌리기 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == refresh:* ]]; then
              SLUG=$(echo "${{ github.event.inputs.site_pages }}" | cut -c9- | tr -cd 'a-z0-9-')
              python site_pages/upload.py refresh "$SLUG" || echo "페이지 본문 갱신 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == tr:* ]]; then
              # 11-19 영어판 번역: tr:export:글번호 / tr:check:글번호 / tr:push:글번호
              ARGS=$(echo "${{ github.event.inputs.site_pages }}" | cut -c4- | tr -cd 'a-z0-9:-' | tr ':' ' ')
              python site_pages/translate.py $ARGS || echo "번역 작업 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == patch:* ]]; then
              # 11-19 공개 글 문장 몇 개만 고치기(lab/patches/<slug>.json)
              SLUG=$(echo "${{ github.event.inputs.site_pages }}" | cut -c7- | tr -cd 'a-z0-9-')
              python site_pages/patch_post.py "$SLUG" || echo "글 고치기 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == publish-passed:* ]]; then
              # 11-19 기준 통과했는데 임시글로 남은 글 공개(로그에 통과 기록 있을 때만)
              PID=$(echo "${{ github.event.inputs.site_pages }}" | cut -c16- | tr -cd '0-9')
              python site_pages/publish_passed.py "$PID" || echo "공개 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == cover:* ]]; then
              # 11-19 공개 글 대표 이미지를 새 표지로(cover:번호 또는 cover:번호:GUIDE). 여러 개는 cover:701:GUIDE,705:GUIDE
              for item in $(echo "${{ github.event.inputs.site_pages }}" | cut -c7- | tr ',' ' '); do
                PID=$(echo "$item" | cut -d: -f1 | tr -cd '0-9'); KICK=$(echo "$item" | cut -s -d: -f2 | tr -cd 'A-Za-z')
                SRC=$(echo "$item" | cut -s -d: -f3 | tr -cd '0-9')   # 11-21 영어판: cover:781:GUIDE:762 (원글 번호)
                python site_pages/cover_post.py "$PID" ${KICK:-DATA} $SRC || echo "표지 바꾸기 실패 $PID"
              done
            elif [[ "${{ github.event.inputs.site_pages }}" == art-note:* ]]; then
              # 11-21 글 끝 '표지 그림' 설명 상자만 넣기: art-note:701,781:762 (영어판은 :원글번호)
              for item in $(echo "${{ github.event.inputs.site_pages }}" | cut -c10- | tr ',' ' '); do
                PID=$(echo "$item" | cut -d: -f1 | tr -cd '0-9'); SRC=$(echo "$item" | cut -s -d: -f2 | tr -cd '0-9')
                python site_pages/cover_post.py "$PID" --note $SRC || echo "그림 설명 실패 $PID"
              done
            elif [ "${{ github.event.inputs.site_pages }}" = "sc-connect" ]; then
              python site_pages/sc_connect.py || echo "서치콘솔 연결 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "sitemap-probe" ]; then
              python site_pages/sitemap_probe.py || echo "사이트맵 확인 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "sitemap-fix" ]; then
              python site_pages/sitemap_fix.py || echo "사이트맵 캐시 비우기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "art-fetch" ]; then
              # 11-20 표지용 공공 명화(CC0) 받기 - lab/art
              python site_pages/fetch_art.py || echo "명화 받기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "art-pool" ]; then
              # 11-21 표지용 명화 후보(나라별 최대 50점, CC0·사후 70년) - lab/art/pool
              python site_pages/art_pool.py || echo "명화 후보 받기 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == art-pool:* ]]; then
              # 11-21 나라 하나만 다시(예: art-pool:korea)
              C=$(echo "${{ github.event.inputs.site_pages }}" | cut -c10- | tr ',' ' ' | tr -cd 'a-z ')   # 11-21 여러 나라: art-pool:china,india
              python site_pages/art_pool.py $C || echo "명화 후보 받기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "market-map" ]; then
              # 11-21 세계 주식시장 지도 페이지(세계은행 시가총액 + ETF 계산) - 비공개 초안, 공개는 사용자 확인 뒤
              python site_pages/market_map.py draft || echo "시장 지도 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "sitekit-probe" ]; then
              python site_pages/sitekit_probe.py || echo "Site Kit 확인 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == fact-recheck:* ]]; then
              # 11-19 공개 글 사실 검증을 좋은 모델로만 다시(글은 안 바꿈, 결과 lab/recheck)
              PID=$(echo "${{ github.event.inputs.site_pages }}" | cut -c14- | tr -cd '0-9')
              python site_pages/fact_recheck.py "$PID" || echo "사실 다시 검증 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "pll-push" ]; then
              python site_pages/pll_plugin.py push || echo "전용 플러그인 올리기 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == pll:* ]]; then
              ARGS=$(echo "${{ github.event.inputs.site_pages }}" | cut -c5- | tr -cd 'a-z0-9=:_-' | tr ':' ' ')
              python site_pages/pll_plugin.py $ARGS || echo "언어 작업 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "board-draft" ]; then
              python ondo/board.py draft || echo "온도판 올리기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "board-en" ]; then
              python ondo/board.py en-create || echo "영어 온도판 만들기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "board-refresh" ]; then
              python ondo/board.py refresh || echo "온도판 갱신 실패"
              (pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1 && python site_pages/shot.py) || echo "화면 캡처 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "board-publish" ]; then
              # 11-12 사용자 '공개해': 온도판 공개 + 머리·바닥글 링크 복원(BOARD_LIVE) + 화면 확인
              python ondo/board.py publish || echo "온도판 공개 실패"
              python site_pages/theme_push.py push || echo "틀 올리기 실패"
              (pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1 && python site_pages/shot.py) || echo "화면 캡처 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "export" ]; then
              python site_pages/export.py || echo "사이트 백업 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "restore-about" ]; then
              python site_pages/restore.py 1 || echo "About 되돌리기 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "revamp" ]; then
              # 개편 한 번에: 틀 올리기 + 분야 이름·글 분류 + 허브 페이지 + 캡처 (2026-11-11)
              python site_pages/theme_push.py push || echo "틀 올리기 실패"
              python site_pages/categories.py || echo "분야 정리 실패"
              python site_pages/hub_pages.py || echo "허브 페이지 실패"
              (pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1 && python site_pages/shot.py) || echo "화면 캡처 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "theme-push" ] || [ "${{ github.event.inputs.site_pages }}" = "theme-restore" ] || [ "${{ github.event.inputs.site_pages }}" = "shot" ]; then
              # 사이트 틀 올리기/되돌리기 뒤 화면 캡처(lab/shots) - 2026-11-11 전체 개편
              if [ "${{ github.event.inputs.site_pages }}" = "theme-push" ]; then python site_pages/theme_push.py push || echo "틀 올리기 실패"; fi
              if [ "${{ github.event.inputs.site_pages }}" = "theme-restore" ]; then python site_pages/theme_push.py restore || echo "틀 되돌리기 실패"; fi
              (pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1 && python site_pages/shot.py) || echo "화면 캡처 실패"
            elif [ "${{ github.event.inputs.site_pages }}" = "drafts-fix" ] || [ "${{ github.event.inputs.site_pages }}" = "link-check" ]; then
              # 11-12: 초안 종합 온도 띠 정리(백업 먼저) + 비공개 글 링크 확인 → lab/link_check.json
              python site_pages/export.py || { echo "백업 실패 - 고치지 않음"; exit 0; }
              if [ "${{ github.event.inputs.site_pages }}" = "drafts-fix" ]; then python site_pages/drafts_fix.py fix || echo "초안 정리 실패"; else python site_pages/drafts_fix.py check || echo "링크 확인 실패"; fi
            elif [ "${{ github.event.inputs.site_pages }}" = "drafts-trash" ]; then
              # 11-19 사용자 결정: 연습 초안 모두 휴지통으로(30일 안 복구 가능) - 백업이 안 되면 지우지 않음
              python site_pages/export.py || { echo "백업 실패 - 지우지 않음"; exit 0; }
              python site_pages/drafts_fix.py trash || echo "초안 휴지통 옮기기 실패"
            elif [[ "${{ github.event.inputs.site_pages }}" == links:* ]]; then
              # 사용자가 준 링크 내용 받기(lab/links) - 작업 환경에서 외부 사이트가 막혀서
              L="${{ github.event.inputs.site_pages }}"
              (pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1 && python site_pages/fetch_links.py "${L#links:}") || echo "링크 받기 실패"
            else
              python site_pages/upload.py "${{ github.event.inputs.site_pages }}" || echo "기본 페이지 올리기 실패"
            fi
            exit 0
          fi
          if [ "${{ github.event.inputs.lab_adsense }}" = "true" ]; then
            python lab_bench.py adsense || echo "애드센스 확인 실패"
            exit 0
          fi
          if [ "${{ github.event.inputs.lab_noise }}" = "true" ]; then
            python lab_bench.py noise || echo "채점 흔들림 측정 실패"
            exit 0
          fi
          if [ "${{ github.event.inputs.lab_exam }}" = "true" ]; then
            python lab_bench.py exam --run || echo "시험지 실행 실패"
            exit 0
          fi
          if [ "${{ github.event.inputs.etf_discover }}" = "true" ]; then
            python etf_auto.py --discover-and-notify
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event.inputs.check_trends }}" = "true" ]; then
            ARGS="--check-trends"
          elif [ "${{ github.event.inputs.check_universe }}" = "true" ]; then
            ARGS="--check-universe"
          elif [ "${{ github.event.inputs.detect_only }}" = "true" ]; then
            ARGS="--detect-only"
          elif [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="--topic ${{ github.event.inputs.topic }}"
          fi
          python etf_auto.py $ARGS

      - name: 상태 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in *_article_state.json *_generation_state.json *_api_usage_log.json; do git add "$f" 2>/dev/null || true; done
          git add etf_article_state.json 2>/dev/null || true
          git add etf_generation_state.json 2>/dev/null || true
          git add etf_api_usage_log.json 2>/dev/null || true
          git add indexnow_key.json 2>/dev/null || true
          git add etf/published_articles 2>/dev/null || true
          git add pending_recommendation.json 2>/dev/null || true
          git add pending_topic.json 2>/dev/null || true
          git add telegram_offset.json 2>/dev/null || true
          git add pending_images.json 2>/dev/null || true
          git add image_inbox.json 2>/dev/null || true
          git add logs 2>/dev/null || true
          git add key_alerts.json 2>/dev/null || true
          git add schedule_state.json 2>/dev/null || true
          git add site_backup 2>/dev/null || true
          git add lab/shots 2>/dev/null || true
          git add lab/links 2>/dev/null || true
          git add lab/link_check.json 2>/dev/null || true
          git add lab/plugin_audit.txt 2>/dev/null || true
          git add lab/translate 2>/dev/null || true
          git add lab/recheck 2>/dev/null || true
          git add lab/sitekit_probe.txt 2>/dev/null || true
          git add lab/art 2>/dev/null || true
          git add lab/market_map.json lab/market_map.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ 변경 없음"
          else
            git commit -m "chore: 수동 실행 상태 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            bash git_push_retry.sh
          fi

      - name: 멈추면 텔레그램으로 알림
        if: failure()
        run: |
          python notify_failure.py "수동 실행" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add failure_alerts.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 실패 알림 기록" && bash git_push_retry.sh) || true

