name: 시험실 (자동 시험)

# 코드를 바꿀 때마다(작업 브랜치에 올릴 때, main으로 합치자는 요청을 만들 때) 시나리오 시험을 돌린다.
# 진짜 키는 쓰지 않는다 - 시크릿을 복원하지 않음.
on:
  pull_request:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest
      - name: 문법 검사
        run: python -m py_compile *.py
      - name: 시나리오 시험
        run: python -m pytest -q
