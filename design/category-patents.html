    }
  };

  /* 탭/버튼이 이동할 주소. 카테고리 전용 페이지를 만들었다면 그 페이지 주소로 바꾸세요. */
  var PAGE_LINKS = {
    etf: '/category/etf/',
    patents: '/category/patents/',
    biotech: '/category/biotech/',
    trend: '/category/trend/',
    energy: '/category/energy/',
    society: '/category/society/'
  };

  /* 한 페이지에 보여줄 글 수: 피처드 1 + 그리드 4 */
  var PER_PAGE = 5;

  /* ── 테마 폭 제한 탈출 + 상단 헤더/여백까지 덮기 (잘 작동하는 검증된 코드) ── */
  var COVER_TOP = true;

  function fullBleed() {
    var el = document.getElementById('ondo-cat-page');
    if (!el) return;
    el.style.position = 'relative';
    el.style.zIndex = '10';
    el.style.setProperty('margin-left', '0px', 'important');
    el.style.setProperty('margin-right', '0px', 'important');
    el.style.setProperty('max-width', 'none', 'important');
    if (COVER_TOP) el.style.setProperty('margin-top', '0px', 'important');
    el.style.width = '';
    var vw = document.documentElement.clientWidth;
    var rect = el.getBoundingClientRect();
    el.style.width = vw + 'px';
    el.style.setProperty('margin-left', (-rect.left) + 'px', 'important');
    if (COVER_TOP) {
      var bar = document.getElementById('wpadminbar');
      var barH = bar ? bar.offsetHeight : 0;
      var topGap = rect.top + window.scrollY - barH;
      if (topGap > 0) el.style.setProperty('margin-top', (-topGap) + 'px', 'important');
    }
    var after = el.getBoundingClientRect().left;
    if (Math.abs(after) > 1) {
      el.style.setProperty('margin-left', ((-rect.left) - after) + 'px', 'important');
    }
    if (COVER_TOP) {
      var bar2 = document.getElementById('wpadminbar');
      var barH2 = bar2 ? bar2.offsetHeight : 0;
      var topResidual = el.getBoundingClientRect().top + window.scrollY - barH2;
      if (Math.abs(topResidual) > 1) {
        var curTop = parseFloat(el.style.marginTop) || 0;
        el.style.setProperty('margin-top', (curTop - topResidual) + 'px', 'important');
      }
    }
    // 아래쪽: 위젯과 테마 푸터 사이의 흰 여백도 덮기
    var footer = document.querySelector('footer');
    if (footer && !el.contains(footer) && !footer.contains(el)) {
      el.style.setProperty('margin-bottom', '0px', 'important');
      var botGap = footer.getBoundingClientRect().top - el.getBoundingClientRect().bottom;
      if (botGap > 0) el.style.setProperty('margin-bottom', (-botGap) + 'px', 'important');
    }
  }
  fullBleed();
  window.addEventListener('resize', fullBleed);
  window.addEventListener('load', fullBleed);
  setTimeout(fullBleed, 600);
  setTimeout(fullBleed, 2000);

  /* ── 유틸 ── */
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function stripHtml(html) {
    var div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || div.innerText || '').trim();
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
    } catch (e) { return ''; }
  }
  function getThumb(post, fallback) {
    try {
      var media = post._embedded['wp:featuredmedia'];
      if (media && media[0] && media[0].source_url) return media[0].source_url;
    } catch (e) {}
    // 대표 이미지도 카테고리 기본 이미지도 없으면 투명 이미지로 채워 깨진 그림 표시를 막는다.
    return fallback || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  }
  /* 글별 소제목 라벨: 첫 번째 태그 이름을 쓰고, 없으면 카테고리 라벨 */
  function getPostLabel(post) {
    try {
      var groups = post._embedded['wp:term'] || [];
      for (var i = 0; i < groups.length; i++) {
        for (var j = 0; j < groups[i].length; j++) {
          if (groups[i][j].taxonomy === 'post_tag' && groups[i][j].name) return groups[i][j].name;
        }
      }
    } catch (e) {}
    return meta.label;
  }
  /* 읽기 시간: 본문 글자수 기준 대략 계산 (한국어 분당 ~600자) */
  function readMinutes(post) {
    try {
      var chars = stripHtml(post.content && post.content.rendered ? post.content.rendered : '').length;
      return Math.max(2, Math.round(chars / 600));
    } catch (e) { return 3; }
  }
  function metaLine(post) {
    return '<span class="oc-meta"><span class="oc-cal"></span>' + escapeHtml(formatDate(post.date)) +
      '<span class="dot">&middot;</span>' + readMinutes(post) + T.minRead + '</span>';
  }

  var meta = CATEGORY_META[CATEGORY] || CATEGORY_META.etf;

  /* ── 상단 바 + 히어로 텍스트 ── */
  (function () {
    document.getElementById('oc-crumb-cat').textContent = meta.label.toUpperCase();
    document.getElementById('oc-hero-title').textContent = meta.label;
    document.getElementById('oc-hero-tagline').textContent = meta.tagline;
    document.getElementById('oc-hero-desc').innerHTML = KO ? meta.desc : (meta.desc_en || meta.desc);
    var order = ['etf', 'trend', 'patents', 'biotech', 'energy', 'society'];
    // 탭은 6개라 짧은 이름을 쓴다(긴 이름은 히어로 제목에만 표시).
    var TAB_LABELS = { etf: 'ETF', trend: 'Trend', patents: 'Tech', biotech: 'Biotech', energy: 'Energy', society: 'Society' };
    var html = '';
    order.forEach(function (slug) {
      var cls = 'oc-tab' + (slug === CATEGORY ? ' is-active' : '');
      html += '<a class="' + cls + '" data-slug="' + slug + '" href="' + PAGE_LINKS[slug] + '">' + escapeHtml(TAB_LABELS[slug]) + '</a>';
    });
    document.getElementById('oc-tabs').innerHTML = html;
  })();

  /* ── 탭 링크 자동 연결: 사이트의 실제 페이지(제목: ETF/PATENTS/BIO/TREND 등)를 찾아 탭에 연결 ── */
  try {
    var TAB_TITLE_MAP = {
      etf: ['etf'],
      patents: ['patents', 'patent', 'tech & patents', 'tech'],
      biotech: ['bio', 'biotech', 'biotech/new drugs'],
      trend: ['trend'],
      energy: ['energy', 'energy & climate'],
      society: ['society']
    };
    fetch(SITE_API + '/pages?per_page=100&_fields=link,title')
      .then(function (r) { return r.json(); })
      .then(function (pages) {
        if (!pages || !pages.length) return;
        var found = {};
        pages.forEach(function (pg) {
          var t = stripHtml(pg.title && pg.title.rendered ? pg.title.rendered : '').toLowerCase().trim();
          Object.keys(TAB_TITLE_MAP).forEach(function (slug) {
            if (!found[slug] && TAB_TITLE_MAP[slug].indexOf(t) !== -1) found[slug] = pg.link;
          });
        });
        document.querySelectorAll('#oc-tabs .oc-tab').forEach(function (a) {
          var slug = a.getAttribute('data-slug');
          if (found[slug]) a.setAttribute('href', found[slug]);
        });
      })
      .catch(function () {});
  } catch (e) {}

  /* ── 히어로 배경 자동 찾기 (허브 페이지와 동일 로직) ── */
  try { (function () {
    var hero = document.getElementById('oc-hero-img');
    if (!hero) return;
    if (hero.getAttribute('src')) return; // 직접 지정했으면 그대로 사용
    fetch(SITE_API + '/media?media_type=image&per_page=100&orderby=date&order=desc&_fields=source_url,slug,media_details')
      .then(function (r) { return r.json(); })
      .then(function (items) {
        if (!items || !items.length) return;
        var good = ['hero', 'banner', 'city', 'main', 'header', 'bg', 'insight'];
        var bad = ['category', 'logo', 'icon', 'favicon', 'profile'];
        var best = null, bestScore = -1;
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var slug = (it.slug || '').toLowerCase();
          var skip = false;
          for (var b = 0; b < bad.length; b++) { if (slug.indexOf(bad[b]) !== -1) { skip = true; break; } }
          if (skip || !it.source_url) continue;
          var score = 0;
          for (var g = 0; g < good.length; g++) { if (slug.indexOf(good[g]) !== -1) { score += 4; break; } }
          var d = it.media_details || {};
          if (d.width >= 1200) score += 1;
          if (d.width && d.height && d.width > d.height * 1.6) score += 2;
          if (score > bestScore) { bestScore = score; best = it; }
        }
        if (best && bestScore > 0) hero.src = best.source_url;
      })
      .catch(function () {});
  })(); } catch (e) {}

  /* ── 필터 칩 렌더 ── */
  var activeChip = null; // null = ALL
  (function () {
    var wrap = document.getElementById('oc-chips');
    var chips = meta.chips || [];
    var html =
      '<span class="oc-chip is-active" data-tag="">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">' +
          '<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>' +
        T.all + '</span>';
    chips.forEach(function (c) {
      html += '<span class="oc-chip" data-tag="' + escapeHtml(c.tag) + '">' + escapeHtml(c.label) + '</span>';
    });
    wrap.innerHTML = html;
    if (!chips.length) wrap.style.display = 'none';
    wrap.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.oc-chip') : null;
      if (!chip) return;
      wrap.querySelectorAll('.oc-chip').forEach(function (c) { c.classList.remove('is-active'); });
      chip.classList.add('is-active');
      activeChip = chip.getAttribute('data-tag') || null;
      loadPosts(1);
    });
  })();

  /* ── 글 목록 렌더 ── */
  function renderList(posts) {
    var wrap = document.getElementById('oc-list');
    if (!posts.length) {
      var isFiltered = !!activeChip;
      wrap.innerHTML =
        '<div class="oc-empty">' +
          '<div class="oc-empty-title">' + T.comingSoonTitle + '</div>' +
          '<div class="oc-empty-desc">' + (isFiltered ? T.noTagPosts : T.comingSoonDesc) + '</div>' +
        '</div>';
      return;
    }
    var featured = posts[0];
    var rest = posts.slice(1);
    var title = stripHtml(featured.title.rendered);
    var excerpt = stripHtml(featured.excerpt.rendered);
    if (excerpt.length > 160) excerpt = excerpt.slice(0, 160) + '...';
    var html =
      '<a class="oc-feat" href="' + featured.link + '">' +
        '<img class="oc-feat-img" src="' + getThumb(featured, meta.image) + '" alt="' + escapeHtml(title) + '" />' +
        '<div class="oc-feat-txt">' +
          '<div class="oc-feat-cat">' + escapeHtml(getPostLabel(featured)) + '</div>' +
          '<h2 class="oc-feat-title">' + escapeHtml(title) + '</h2>' +
          metaLine(featured) +
          '<p class="oc-feat-excerpt">' + escapeHtml(excerpt) + '</p>' +
        '</div>' +
        '<span class="oc-fab">&#8594;</span>' +
      '</a>';
    if (rest.length) {
      html += '<div class="oc-grid">';
      rest.forEach(function (post) {
        var t = stripHtml(post.title.rendered);
        html +=
          '<a class="oc-card" href="' + post.link + '">' +
            '<img class="oc-card-img" src="' + getThumb(post, meta.image) + '" alt="' + escapeHtml(t) + '" />' +
            '<div class="oc-card-txt">' +
              '<div class="oc-card-cat">' + escapeHtml(getPostLabel(post)) + '</div>' +
              '<div class="oc-card-title">' + escapeHtml(t) + '</div>' +
              metaLine(post) +
            '</div>' +
            '<span class="oc-fab">&#8594;</span>' +
          '</a>';
      });
      html += '</div>';
    }
    wrap.innerHTML = html;
  }

  /* ── 페이지네이션 렌더 ── */
  function renderPager(current, total) {
    var pager = document.getElementById('oc-pager');
    if (total <= 1) { pager.style.display = 'none'; return; }
    pager.style.display = 'flex';
    var html = '';
    html += '<span class="oc-page' + (current <= 1 ? ' is-disabled' : '') + '" data-page="' + (current - 1) + '">&#8249;</span>';
    var start = Math.max(1, Math.min(current - 2, total - 4));
    var end = Math.min(total, start + 4);
    for (var p = start; p <= end; p++) {
      html += '<span class="oc-page' + (p === current ? ' is-active' : '') + '" data-page="' + p + '">' + p + '</span>';
    }
    html += '<span class="oc-page' + (current >= total ? ' is-disabled' : '') + '" data-page="' + (current + 1) + '">&#8250;</span>';
    pager.innerHTML = html;
  }
  document.getElementById('oc-pager').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.oc-page') : null;
    if (!btn || btn.classList.contains('is-disabled') || btn.classList.contains('is-active')) return;
    var p = parseInt(btn.getAttribute('data-page'), 10);
    if (p >= 1) {
      loadPosts(p);
      var body = document.querySelector('#ondo-cat-page .oc-body');
      if (body) body.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  /* ── 데이터 로딩 ── */
  var categoryIdCache;
  var tagIdCache = {};

  function getCategoryId() {
    if (categoryIdCache !== undefined) return Promise.resolve(categoryIdCache);
    return fetch(SITE_API + '/categories?slug=' + encodeURIComponent(CATEGORY))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        categoryIdCache = (data && data.length > 0) ? data[0].id : null;
        return categoryIdCache;
      })
      .catch(function () { categoryIdCache = null; return null; });
  }
  function getTagId(search) {
    if (tagIdCache[search] !== undefined) return Promise.resolve(tagIdCache[search]);
    return fetch(SITE_API + '/tags?search=' + encodeURIComponent(search) + '&_fields=id,name&per_page=1')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        tagIdCache[search] = (data && data.length > 0) ? data[0].id : null;
        return tagIdCache[search];
      })
      .catch(function () { tagIdCache[search] = null; return null; });
  }

  function loadPosts(page) {
    var wrap = document.getElementById('oc-list');
    wrap.innerHTML = '<div class="oc-loading">' + T.loading + '</div>';
    getCategoryId().then(function (catId) {
      if (!catId) { renderList([]); renderPager(1, 1); return; }
      var tagPromise = activeChip ? getTagId(activeChip) : Promise.resolve(null);
      tagPromise.then(function (tagId) {
        if (activeChip && !tagId) { renderList([]); renderPager(1, 1); return; }
        var url = SITE_API + '/posts?categories=' + catId +
          (tagId ? '&tags=' + tagId : '') +
          '&per_page=' + PER_PAGE + '&page=' + page + '&orderby=date&order=desc&_embed';
        fetch(url)
          .then(function (res) {
            var total = parseInt(res.headers.get('X-WP-TotalPages') || '1', 10);
            return res.json().then(function (posts) { return { posts: posts || [], total: total }; });
          })
          .then(function (r) {
            renderList(Array.isArray(r.posts) ? r.posts : []);
            renderPager(page, r.total);
          })
          .catch(function () {
            wrap.innerHTML = '<div class="oc-loading">' + T.loadError + '</div>';
          });
      });
    });
  }

  loadPosts(1);

  // 10초 후에도 로딩 중이면 안내 문구로 교체
  setTimeout(function () {
    var box = document.getElementById('oc-list');
    if (box && box.querySelector('.oc-loading') && box.querySelector('.oc-loading').textContent === T.loading) {
      box.innerHTML = '<div class="oc-loading">' + T.loadError + '</div>';
    }
  }, 10000);
})();
</script>
